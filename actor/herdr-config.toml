# herdr config inside the actor (~/.config/herdr/config.toml).
#
# Actors have default-deny egress; the only allowed host is api.anthropic.com.
# Stop herdr from trying to reach herdr.dev for release and detection-manifest
# checks: they would only fail, and the actor image pins its herdr version.
# Upgrade by rebuilding the image instead.
[update]
version_check = false
manifest_check = false
